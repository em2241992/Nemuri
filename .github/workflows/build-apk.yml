name: Build Nemuri Beta APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GitHub Debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Package Ready APK
        id: package_apk
        run: |
          set -euo pipefail
          APK_SRC=$(find app/build/outputs/apk/github/debug -maxdepth 2 -name '*.apk' | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No APK found under app/build/outputs/apk/github/debug"
            exit 1
          fi
          APK_NAME="Nemuri-v0.1.${{ github.run_number }}-debug.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nemuri-Ready-APK
          path: ${{ steps.package_apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-beta
          name: "Nemuri Beta Build #${{ github.run_number }}"
          prerelease: true
          files: ${{ steps.package_apk.outputs.apk_name }}
