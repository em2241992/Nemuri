name: Build Nemuri Beta APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS_FILE="$RUNNER_TEMP/nemuri-signing.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KS_FILE"
            if [ ! -s "$KS_FILE" ]; then
              echo "::error::Decoded keystore file is empty."
              exit 1
            fi
            echo "NEMURI_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "Using persistent signing keystore from GitHub Secrets"
          else
            echo "KEYSTORE_BASE64 not set; using committed app/debug.keystore for persistent beta/debug signing."
          fi

      - name: Build GitHub Debug APK
        env:
          NEMURI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEMURI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEMURI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Package Ready APK
        id: package_apk
        run: |
          set -euo pipefail
          APK_SRC=$(find app/build/outputs/apk/github/debug -maxdepth 2 -name '*.apk' | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No APK found under app/build/outputs/apk/github/debug"
            exit 1
          fi
          APK_NAME="Nemuri-v0.1.${{ github.run_number }}-debug.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME"
          echo "=== Packaged native ABIs ==="
          unzip -l "$APK_NAME" | awk '/lib\/[^\/]+\//{split($4,a,"/"); print a[2]}' | sort -u || true
          echo "=== APK Signing Certificate (v2/v3) ==="
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --print-certs "$APK_NAME" || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nemuri-Ready-APK
          path: ${{ steps.package_apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-beta
          name: "Nemuri Beta Build #${{ github.run_number }}"
          prerelease: true
          files: ${{ steps.package_apk.outputs.apk_name }}
