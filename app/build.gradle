import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'com.android.application'
	id 'com.google.devtools.ksp'
	id 'com.google.dagger.hilt.android'
	id 'org.jetbrains.kotlin.plugin.compose'
}

android {
	compileSdk {
		version = release(37) {
			minorApiLevel = 0
		}
	}
	namespace = 'org.nemuri.app'

	defaultConfig {
		def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 1
		applicationId = 'org.nemuri.app'
		minSdk = 26
		targetSdk = 37
		versionCode = ciRunNumber
		versionName = "0.2.${ciRunNumber}-beta"
		base {
			archivesName = "Nemuri-v${versionName}"
		}
		androidResources {
			generateLocaleConfig = false
		}
	}

	def ksPath = System.getenv('NEMURI_KEYSTORE_PATH')
	def ksPass = System.getenv('NEMURI_KEYSTORE_PASSWORD')
	def ksAlias = System.getenv('NEMURI_KEY_ALIAS')
	def ksKeyPass = System.getenv('NEMURI_KEY_PASSWORD')
	def hasPersistentSigning = ksPath && ksPass && ksAlias && ksKeyPass && file(ksPath).exists()
	if (ksPath && !hasPersistentSigning) {
		logger.warn('NEMURI_KEYSTORE_PATH is set, but persistent signing is incomplete; verify KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets.')
	}

	signingConfigs {
		debug {
			if (hasPersistentSigning) {
				storeFile = file(ksPath)
				storePassword = ksPass
				keyAlias = ksAlias
				keyPassword = ksKeyPass
			} else {
				storeFile = file('debug.keystore')
				storePassword = 'android'
				keyAlias = 'androiddebugkey'
				keyPassword = 'android'
			}
		}
		if (hasPersistentSigning) {
			release {
				storeFile = file(ksPath)
				storePassword = ksPass
				keyAlias = ksAlias
				keyPassword = ksKeyPass
			}
		}
	}

	buildTypes {
		debug {
			applicationIdSuffix = '.debug'
			signingConfig = signingConfigs.debug
		}
		release {
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			if (hasPersistentSigning) {
				signingConfig = signingConfigs.release
			}
		}
		preview {
			initWith release
			applicationIdSuffix = '.preview'
			matchingFallbacks = ['release']
			signingConfig = signingConfigs.debug
		}
	}

	flavorDimensions = ['store']
	productFlavors {
		github {
			dimension = 'store'
			isDefault = true
		}
		fdroid {
			dimension = 'store'
		}
	}

	buildFeatures {
		buildConfig = true
		compose = true
	}

	packaging {
		resources {
			exclude 'META-INF/README.md'
			exclude 'META-INF/NOTICE.md'
		}
		jniLibs {
			useLegacyPackaging = true
		}
	}

	dependenciesInfo {
		includeInApk = false
		includeInBundle = false
	}

	compileOptions {
		coreLibraryDesugaringEnabled = true
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_11
		freeCompilerArgs.addAll([
			'-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi',
			'-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
		])
	}
}

dependencies {
	implementation project(':engine')

	coreLibraryDesugaring libs.desugar.jdk.libs

	implementation libs.androidx.appcompat
	implementation libs.androidx.biometric
	implementation libs.material

	implementation platform(libs.androidx.compose.bom)
	implementation libs.androidx.compose.runtime
	implementation libs.androidx.compose.ui
	implementation libs.androidx.compose.ui.tooling.preview
	debugImplementation libs.androidx.compose.ui.tooling
	implementation libs.androidx.compose.foundation
	implementation libs.androidx.compose.material3
	implementation libs.androidx.compose.activity
	implementation libs.androidx.compose.material.icons.extended
	implementation libs.androidx.lifecycle.runtime.compose
	implementation libs.androidx.lifecycle.viewmodel.compose
	implementation libs.coil.compose

	implementation libs.hilt.android
	ksp libs.hilt.compiler
	implementation libs.androidx.hilt.work
	ksp libs.androidx.hilt.compiler

	testImplementation libs.junit
	testImplementation libs.kotlinx.coroutines.test
}
